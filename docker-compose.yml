services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-resolve360-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      # - VITE_API_BASE_URL=http://localhost:8000/api # Set when FastAPI backend container is launched
    restart: unless-stopped

